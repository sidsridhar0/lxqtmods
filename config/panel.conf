[General]
panels=panel1

[panel1]
iconSize=24
panelSize=48
position=Left
plugins=fancymenu,desktopswitch,quicklaunch,taskbar,statusnotifier,tray,mount,volume,worldclock,showdesktop

[quicklaunch]
type=quicklaunch
alignment=Left
apps\size=4
apps\1\desktop=$HOME/.local/share/applications/lxqtmods-dashboard.desktop
apps\2\desktop=$HOME/.local/share/applications/helium.desktop
apps\3\desktop=/usr/share/applications/com.microsoft.VSCode.desktop
apps\4\desktop=$HOME/.local/share/flatpak/exports/share/applications/com.spotify.Client.desktop

[volume]
type=volume
alignment=Right

[taskbar]
type=taskbar
buttonWidth=220
closeOnMiddleClick=true
groupingEnabled=true
showGroupOnHover=true

[statusnotifier]
type=statusnotifier

[tray]
type=tray
